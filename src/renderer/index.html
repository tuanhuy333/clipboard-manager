<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Clipboard Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <input id="search" type="text" placeholder="Search clipboard history..." autocomplete="off" />
      <button id="clear" title="Clear all unpinned items">Clear</button>
    </header>
    <ul id="list"></ul>
    <div id="empty" hidden>No items found</div>
    <div id="confirm" hidden>
      <div class="dialog" role="alertdialog" aria-labelledby="confirm-message">
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-cancel">Cancel</button>
          <button id="confirm-ok" class="danger">Delete</button>
        </div>
      </div>
    </div>
    <footer>↑↓ navigate · Enter copy · Esc close</footer>
    <script src="renderer.js"></script>
  </body>
</html>
